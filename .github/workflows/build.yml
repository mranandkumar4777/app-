name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: phone-app-android
        run: gradle assembleDebug --no-daemon

      - name: Name the APK
        run: cp phone-app-android/app/build/outputs/apk/debug/app-debug.apk PresenterRemote.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PresenterRemote-APK
          path: PresenterRemote.apk
